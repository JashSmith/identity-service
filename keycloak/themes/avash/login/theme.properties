# Avash login theme: Keycloak's keycloak.v2 login pages with Persian (RTL) texts, the Avash palette and fonts,
# light and dark (follows the operating system).
# Applications use it in two ways (set by the gateway, PUT /api/identity/applications/{id}/login-page):
#   - the organisation's central page (the realm's login theme, PUT /api/identity/settings/login), or
#   - a branded page: login_theme=avash plus the iam.login.* client attributes, rendered by footer.ftl.
# Only footer.ftl is overridden (keycloak.v2 provides it as an extension point), so Keycloak upgrades keep working.
parent=keycloak.v2
import=common/keycloak
locales=fa,en
rtlLanguageCodes=fa
darkMode=true
styles=css/styles.css css/avash.css
