# Avash login theme: Keycloak's keycloak.v2 login pages with Persian (RTL) texts as the default language.
# Applications pick it (or their own theme) through the "login_theme" client attribute; the realm default is
# set with PUT /api/identity/settings/login.
parent=keycloak.v2
import=common/keycloak
locales=fa,en
rtlLanguageCodes=fa
