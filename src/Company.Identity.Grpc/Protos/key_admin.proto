syntax = "proto3";
option csharp_namespace = "Company.Identity.Grpc";
package company.identity.v1;

service KeyAdminService {
  rpc GenerateKey(GenerateKeyRequest) returns (SigningKey);
  rpc ImportKey(ImportKeyRequest) returns (SigningKey);
  rpc GetKey(GetKeyRequest) returns (SigningKeyDetail);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  rpc Rotate(RotateRequest) returns (RotationOperation);
  rpc Rollback(RollbackRequest) returns (RotationOperation);
  rpc GetRotationState(GetRotationStateRequest) returns (RotationState);
}
message GenerateKeyRequest { int32 size = 1; string kid = 2; string reason = 3; }
message ImportKeyRequest { string pem = 1; string kid = 2; string reason = 3; }
message GetKeyRequest { string kid = 1; }
message ListKeysRequest { int32 page = 1; int32 page_size = 2; }
message ListKeysResponse { repeated SigningKey items = 1; int32 total = 2; int32 page = 3; int32 page_size = 4; }
message RotateRequest { string reason = 1; string idempotency_key = 2; int32 size = 3; string target_kid = 4; }
message RollbackRequest { string kid = 1; string reason = 2; string idempotency_key = 3; }
message GetRotationStateRequest {}
message SigningKey { string kid = 1; int32 size = 2; string state = 3; string public_fingerprint = 4; string vault_path = 5; int32 vault_version = 6; string realm = 7; string keycloak_component_id = 8; string created_at = 9; string activated_at = 10; string origin = 11; }
message SigningKeyDetail { SigningKey key = 1; bool present_in_jwks = 2; string jwks_fingerprint_match = 3; }
message RotationOperation { string operation_id = 1; string realm = 2; string target_kid = 3; string previous_kid = 4; string current_step = 5; string status = 6; string started_at = 7; string updated_at = 8; string actor = 9; string failure_reason = 10; }
message RotationState { string realm = 1; string active_kid = 2; repeated string passive_kids = 3; repeated string disabled_kids = 4; repeated RotationOperation in_flight = 5; string as_of = 6; }
