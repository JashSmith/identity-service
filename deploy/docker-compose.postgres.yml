# Fallback for CI / laptops that cannot run Oracle XE.
# Usage: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml up
services:
  identity-facade:
    environment:
      Identity__Persistence__Provider: postgres
      Identity__KeyMetadata__Provider: postgres
      ConnectionStrings__Identity: "Host=identity-db;Port=5432;Database=identity;Username=identity;Password=identity-development-only"
      ConnectionStrings__KeyMetadata: "Host=identity-meta-db;Port=5432;Database=identity_meta;Username=identity_meta;Password=identity-development-only"
    depends_on:
      keycloak:
        condition: service_healthy
      identity-db:
        condition: service_healthy
      identity-meta-db:
        condition: service_healthy
      vault:
        condition: service_started
      redis:
        condition: service_started

  keycloak:
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-development-only}
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-development-only}
    volumes: [keycloak-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity-development-only}
    volumes: [identity-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-meta-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity_meta
      POSTGRES_USER: identity_meta
      POSTGRES_PASSWORD: ${IDENTITY_META_DB_PASSWORD:-identity-development-only}
    volumes: [identity-meta-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_meta -d identity_meta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keycloak-postgres:
  identity-postgres:
  identity-meta-postgres:
