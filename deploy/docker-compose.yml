services:
  identity-facade:
    build:
      context: ..
      dockerfile: deploy/Identity.Api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
      Identity__Authority: http://keycloak:8080/realms/company
      # Keycloak proxy/admin base — the only place the facade's Keycloak address is configured.
      Identity__Keycloak__BaseUrl: http://keycloak:8080
      Identity__RequireHttpsMetadata: "false"
      Authentication__Schemes__Bearer__RequireHttpsMetadata: "false"
      # Public self-URL used to rewrite jwks_uri in the proxied discovery document.
      # Must match the host port published for the facade (FACADE_HTTP_PORT, default 5080).
      Identity__PublicBaseUrl: http://localhost:${FACADE_HTTP_PORT:-5080}
      # Tokens are minted for the facade's own Keycloak client, so its audience is that client id.
      Identity__Audience: identity-facade
      Identity__KeycloakAdmin__BaseUrl: http://keycloak:8080
      Identity__KeycloakAdmin__Realm: company
      Identity__KeycloakAdmin__AdminClientId: admin-cli
      Identity__KeycloakAdmin__AdminUsername: ${KEYCLOAK_ADMIN:-admin}
      Identity__KeycloakAdmin__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD:-admin-development-only}
      Identity__Redis__Configuration: redis:6379
      # Multi-Database Configuration for Dashboard & Identity Service
      Database__Provider: ${DB_PROVIDER:-postgres}
      Database__ConnectionStrings__postgres: "Host=postgres-db;Port=5432;Database=keycloak;Username=keycloak;Password=${DB_PASSWORD:-keycloak-development-only}"
      Database__ConnectionStrings__mssql: "Server=mssql-db,1433;Database=keycloak;User Id=sa;Password=${DB_PASSWORD:-SqlPassword123!Safe};TrustServerCertificate=True"
      Database__ConnectionStrings__oracle: "User Id=keycloak;Password=${DB_PASSWORD:-keycloak-development-only};Data Source=oracle-db:1521/XEPDB1"
    ports: [ "${FACADE_HTTP_PORT:-5080}:5080" ]
    healthcheck:
      # aspnet image ships no curl — probe over /dev/tcp.
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5080 && printf \"GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && timeout 3 head -1 <&3 | grep -q 200'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_started

  keycloak:
    build:
      context: ..
      dockerfile: deploy/Keycloak.Dockerfile
    command: start-dev --http-port=8080 --import-realm
    environment:
      # Database Provider: postgres | mssql | oracle
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
      KC_DB: ${KC_DB:-}
      KC_DB_URL: ${KC_DB_URL:-}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-development-only}
    ports: [ "${KEYCLOAK_HTTP_PORT:-8080}:8080" ]
    volumes:
      - ./realm-company.json:/opt/keycloak/data/import/realm-company.json:ro
    depends_on:
      postgres-db:
        condition: service_healthy
        required: false
      mssql-db:
        condition: service_healthy
        required: false
      oracle-db:
        condition: service_healthy
        required: false
    healthcheck:
      # Keycloak 26.4 images ship no curl/wget; probe the management port (9000) over /dev/tcp.
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && timeout 3 head -1 <&3 | grep -q 200'" ]
      interval: 10s
      timeout: 5s
      retries: 35
      start_period: 60s

  # Dev-only one-shot: Keycloak on plain HTTP counts every inbound connection that
  # does not originate from 127.0.0.1 as "external", and the default master realm
  # has sslRequired=external, which rejects the login page / admin token request
  # with "HTTPS required". A fresh master realm can only be patched over a
  # loopback connection, so this container shares the keycloak container's
  # network namespace and calls kcadm against http://localhost:8080 (idempotent).
  keycloak-ssl-patch:
    image: quay.io/keycloak/keycloak:26.4
    restart: "no"
    network_mode: "service:keycloak"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user "$${KEYCLOAK_ADMIN}" --password "$${KEYCLOAK_ADMIN_PASSWORD}"
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE
        /opt/keycloak/bin/kcadm.sh update realms/company -s sslRequired=NONE
        echo "sslRequired set to NONE on realms 'master' and 'company'"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-development-only}

  # --- Database Option 1: PostgreSQL (Fast, Lightweight Default) ---
  postgres-db:
    image: postgres:16-alpine
    profiles: [ "postgres" ]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:-keycloak-development-only}
    ports: [ "${POSTGRES_PORT:-5436}:5432" ]
    volumes: [ keycloak-postgres-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # --- Database Option 2: Microsoft SQL Server ---
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [ "mssql" ]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-SqlPassword123!Safe}
      MSSQL_PID: Developer
    ports: [ "${MSSQL_PORT:-1434}:1433" ]
    volumes: [ keycloak-mssql-data:/var/opt/mssql ]
    healthcheck:
      # Probes SQL server and ensures 'keycloak' database exists
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"IF DB_ID('keycloak') IS NULL CREATE DATABASE [keycloak]; SELECT 1;\"" ]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 20s

  # --- Database Option 3: Oracle Database ---
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    profiles: [ "oracle" ]
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:-oracle-development-only}
      APP_USER: keycloak
      APP_USER_PASSWORD: ${DB_PASSWORD:-keycloak-development-only}
    ports: [ "${ORACLE_PORT:-1522}:1521" ]
    volumes: [ keycloak-oracle-data:/opt/oracle/oradata ]
    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 35
      start_period: 45s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [ identity-redis:/data ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sample consumer — discovers its 10 [RequirePermission] actions at startup and registers
  # them through the facade; it never contacts Keycloak directly. Validates tokens via the
  # facade's discovery/JWKS proxy (AcceptIssuerFromDiscovery).
  order-service:
    build:
      context: ..
      dockerfile: deploy/OrderService.Sample.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5180
      Identity__Authority: http://identity-facade:5080
      PermissionRegistration__IdentityServer: http://identity-facade:5080
      PermissionRegistration__ClientId: order-service
      PermissionRegistration__ClientSecret: order-service-development-only
    ports: [ "${ORDER_HTTP_PORT:-5180}:5180" ]
    depends_on:
      identity-facade:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5180 && printf \"GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && timeout 3 head -1 <&3 | grep -q 200'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  keycloak-postgres-data:
  keycloak-mssql-data:
  keycloak-oracle-data:
  identity-redis:

networks:
  default:
    name: identity-network
    driver: bridge